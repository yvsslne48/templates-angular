<h2>Mes tâches</h2>

@if (tasks.length === 0) {
  <p class="empty">Aucune tâche pour l'instant</p>
} @else {
  <ul>
    @for (task of tasks; track task.id) {
      <li>{{ task.title }} <span class="date">({{ task.dueDate }})</span></li>
    }
  </ul>
}

<button (click)="clearTasks()">Vider la liste</button>
